name: Storage format conformance

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  conformance:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            check: Offline Go reference vectors
          - os: windows-latest
            check: Offline Go tests on Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      GOTOOLCHAIN: go1.27.4
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the pinned toolchain and dependencies
        shell: bash
        run: |
          go version
          go mod download
          go mod verify
      - name: Check that the Linux build includes the SQLite restart trial
        if: runner.os == 'Linux'
        env:
          GOPROXY: 'off'
        run: |
          test "$(go env CGO_ENABLED)" = 1
          go test -mod=readonly -list '^TestAcknowledgedRevocationSurvivesRestart$' ./internal/conformance | grep -Fx TestAcknowledgedRevocationSurvivesRestart
      - name: Run the offline vectors
        env:
          GOPROXY: 'off'
        run: go test -mod=readonly -count=1 -v ./...
      - name: Verify catalog reads across isolated network hosts
        if: runner.os == 'Linux'
        run: bash scripts/test-provider-netns.sh
