[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hivescope-bridge"
version = "0.0.1"
description = "HiveScope real-time bridge — WebSocket server for multi-agent AI visualization"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.22",
    "websockets>=12.0",
    "pluggy>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "httpx>=0.27",
]
chatdev = [
    "httpx>=0.27",
]

[project.scripts]
chatdev-with-hivescope = "hivescope_bridge.adapters.chatdev:cli_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hivescope_bridge*", "scripts*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
