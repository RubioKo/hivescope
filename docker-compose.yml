services:
  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8765:8765"
    environment:
      - HIVESCOPE_WS_HOST=0.0.0.0
      - HIVESCOPE_WS_PORT=8765
    command: python -m uvicorn hivescope_bridge.main:app --host 0.0.0.0 --port 8765

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_WS_HOST=localhost
      - VITE_WS_PORT=8765
    command: sh -c "corepack enable && pnpm install && pnpm dev --host 0.0.0.0"
    depends_on:
      - bridge
